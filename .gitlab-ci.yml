variables:
  KUBE_NAMESPACE: connect2music
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_REGISTRY: $CI_REGISTRY  
  #CONTAINER_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}

stages:
  - build
  - dockerize
  - manifest
  - deploy

# build stage
build-staging:
  stage: build
  environment:
    name: staging
    url: ${STAGING_URL}
  only:
    - main
  image: node:20-alpine
  script:
    - export
    - npm install -g pnpm
    - pnpm install --frozen-lockfile

build-production:
  stage: build
  when: manual
  environment:
    name: production
    url: ${PRODUCTION_URL}  
  image: node:20-alpine
  script:
    - export
    - npm install -g pnpm
    - pnpm install --frozen-lockfile

## STAGING

# Base job template for building Docker images
.docker_build_template:
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "Starting Docker build process"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Logged in to Docker registry"

# BUILD DOCKER

## Staging
build_docker_image_staging_amd64:
  extends: .docker_build_template
  only:
    - main
  environment:
    name: staging
    url: ${STAGING_URL}  
  stage: dockerize
  tags:
    - amd64
    - privileged
  script:
    - echo "Building Docker image for Feedback app"
    - IMAGE_TAG="staging-${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}}"
    - echo image tag is $IMAGE_TAG
    - echo $IMAGE_TAG > image_tag.txt # save image tag to file, to be used in deploy job
    - docker build -t $DOCKER_REGISTRY/connect2music/feedback-app:amd64-$IMAGE_TAG .
    - docker push $DOCKER_REGISTRY/connect2music/feedback-app:amd64-$IMAGE_TAG


build_docker_image_staging_arm64:
  extends: .docker_build_template
  only:
    - main
  stage: dockerize
  environment:
    name: staging
    url: ${STAGING_URL}  
  tags:
    - arm64
    - privileged
  script:
    - echo "Building Docker image for Feedback app"
    - IMAGE_TAG="staging-${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}}"
    - echo image tag is $IMAGE_TAG
    - docker build -t $DOCKER_REGISTRY/connect2music/feedback-app:arm64-$IMAGE_TAG .
    - docker push $DOCKER_REGISTRY/connect2music/feedback-app:arm64-$IMAGE_TAG

## Production

build_docker_image_production_amd64:
  extends: .docker_build_template
  tags:
    - amd64
    - privileged
  only:
    - production
  environment:
    name: production
    url: ${PRODUCTION_URL}      
  stage: dockerize
  script:
    - echo "Building Docker image for Feedback app"
    - IMAGE_TAG="production-${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}}"
    - docker build -t $DOCKER_REGISTRY/connect2music/feedback-app:amd64-$IMAGE_TAG .
    - docker push $DOCKER_REGISTRY/connect2music/feedback-app:amd64-$IMAGE_TAG

build_docker_image_production_arm64:
  extends: .docker_build_template
  tags:
    - arm64
    - privileged
  only:
    - production
  stage: dockerize
  environment:
    name: production
    url: ${PRODUCTION_URL}    
  script:
    - echo "Building Docker image for Feedback app"
    - IMAGE_TAG="production-${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}}"
    - docker build -t $DOCKER_REGISTRY/connect2music/feedback-app:arm64-$IMAGE_TAG .
    - docker push $DOCKER_REGISTRY/connect2music/feedback-app:arm64-$IMAGE_TAG

create_manifest_staging:
  extends: .docker_build_template
  stage: manifest
  tags:
    - amd64
    - privileged
  environment:
    name: staging
    url: ${STAGING_URL}
  script:
    - IMAGE_TAG="staging-${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}}"
    - IMAGE_NAME="${DOCKER_REGISTRY}/connect2music/feedback-app"
    - AMD64_IMAGE="${IMAGE_NAME}:amd64-${IMAGE_TAG}"
    - ARM64_IMAGE="${IMAGE_NAME}:arm64-${IMAGE_TAG}"
    - echo "Creating Docker manifest for multi-arch image"
    - echo $IMAGE_TAG > image_tag.txt # save image tag to file, to be used in deploy job
    - docker manifest create $IMAGE_NAME:$IMAGE_TAG $AMD64_IMAGE $ARM64_IMAGE
    - echo "Manifest created, pushing..."
    - docker manifest push $IMAGE_NAME:$IMAGE_TAG
  only:
    - main
  needs:
    - build_docker_image_staging_arm64
    - build_docker_image_staging_amd64
  artifacts:
    paths:
      - image_tag.txt

create_manifest_production:
  extends: .docker_build_template
  stage: manifest
  only:
    - production
  tags:
    - amd64
    - privileged
  environment:
    name: production
    url: ${PRODUCTION_URL}    
  script:
    - IMAGE_TAG="production-${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}}"
    - IMAGE_NAME="${DOCKER_REGISTRY}/connect2music/feedback-app"
    - AMD64_IMAGE="${IMAGE_NAME}:amd64-${IMAGE_TAG}"
    - ARM64_IMAGE="${IMAGE_NAME}:arm64-${IMAGE_TAG}"
    - echo "Creating Docker manifest for multi-arch image"
    - echo $IMAGE_TAG > image_tag.txt # save image tag to file, to be used in deploy job
    - docker manifest create $IMAGE_NAME:$IMAGE_TAG $AMD64_IMAGE $ARM64_IMAGE
    - echo "Manifest created, pushing..."
    - docker manifest push $IMAGE_NAME:$IMAGE_TAG
  needs:
    - build_docker_image_production_amd64
    - build_docker_image_production_arm64
  artifacts:
    paths:
      - image_tag.txt


# Deploy to staging
deploy-staging:
  stage: deploy
  image: alpine/helm:3.12.0
  environment:
    name: staging
    url: ${STAGING_URL}
  dependencies:
  - create_manifest_staging  # Ensure this job waits for the correct artifact
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - IMAGE_TAG=$(cat image_tag.txt)  # Load the IMAGE_TAG from the artifact
  script:
    - |
      helm upgrade --install feedback-app-staging ./chart \
        --namespace $KUBE_NAMESPACE \
        --set image.repository=$DOCKER_REGISTRY/connect2music/feedback-app \
        --set image.tag=$IMAGE_TAG \
        --set image.pullPolicy="Always"
        --set DB_URL=${DB_URL} \
        --set NEXTAUTH_URL="${NEXTAUTH_URL}" \
        --set NEXTAUTH_SECRET="${NEXTAUTH_SECRET}" \
        --set GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
        --set GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
        --set serviceName=feedback-app-staging \
        --set external_fqdn="feedback-staging.apml.nl"
  only:
    - main


# Deploy to production (manual step)
deploy-production:
  stage: deploy
  image: alpine/helm:3.12.0
  environment:
    name: production
    url: ${PRODUCTION_URL}
  when: manual
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
  script:
    - |
      helm upgrade --install $HELM_RELEASE_NAME ./chart \
        --namespace $KUBE_NAMESPACE \
        --set image.repository=${CI_REGISTRY_IMAGE} \
        --set image.tag=${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA} \
        --set db.host=${PROD_DB_HOST} \
        --set db.database=${PROD_DB_NAME} \
        --set db.username=${PROD_DB_USER} \
        --set db.password=${PROD_DB_PASSWORD} \
        --set-string env.NEXTAUTH_URL="${PROD_NEXTAUTH_URL}" \
        --set-string env.NEXTAUTH_SECRET="${PROD_NEXTAUTH_SECRET}" \
        --set-string env.GOOGLE_CLIENT_ID="${PROD_GOOGLE_CLIENT_ID}" \
        --set-string env.GOOGLE_CLIENT_SECRET="${PROD_GOOGLE_CLIENT_SECRET}" \
        --set-string env.DATABASE_URL="${PROD_DB_URL}" \
        --values values.production.yaml
