apiVersion: v1
kind: Secret
metadata:
  name: {{ include "c2m-testing.fullname" . }}-db
  labels:
    {{- include "c2m-testing.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.db.host | default "postgres" }}
  port: {{ .Values.db.port | default "5432" | quote }}
  database: {{ .Values.db.database | default "appdb" }}
  username: {{ .Values.db.username | default "postgres" }}
  password: {{ .Values.db.password | default "" }}
  # Connection string for the application
  url: {{ .Values.db.url | default (printf "postgresql://%s:%s@%s:%s/%s" 
    (default "postgres" .Values.db.username)
    (default "" .Values.db.password)
    (default "postgres" .Values.db.host)
    (default "5432" .Values.db.port)
    (default "appdb" .Values.db.database)) }}
