apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "c2m-testing.fullname" . }}-migrations
  labels:
    {{- include "c2m-testing.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "c2m-testing.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              # Install PostgreSQL client
              echo "Installing PostgreSQL client..."
              apk add --no-cache postgresql-client
              
              # Extract connection details from DATABASE_URL
              DB_HOST=$(echo "$DATABASE_URL" | sed -n 's/.*\/\/\([^@]*@\)\?\([^:]*\)\(:.*\)\?\/.*/\2/p')
              DB_PORT=$(echo "$DATABASE_URL" | sed -n 's/.*:\/\/[^:]*\(:[0-9]\+\).*/\1/p' | cut -d: -f2)
              DB_PORT=${DB_PORT:-5432}
              
              # Wait for PostgreSQL to be ready
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -d "$DATABASE_URL"; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done
              
              # Install dependencies
              echo "Installing dependencies..."
              npm install -g pnpm
              pnpm install --frozen-lockfile
              
              # Run migrations
              echo "Running database migrations with drizzle-kit..."
              npx drizzle-kit migrate
              
              echo "Migrations completed successfully"
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              value: {{ required "A valid database URL is required" .Values.db.url | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
