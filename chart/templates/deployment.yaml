apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}
  labels:
    app: {{ .Values.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
    spec:
      containers: 
        - name: feedback-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env: 
            - name: DB_URL
              value: "{{ .Values.DB_URL }}"
            - name: NEXTAUTH_URL
              value: "{{ .Values.NEXTAUTH_URL }}"
            - name: NEXTAUTH_SECRET
              value: "{{ .Values.NEXTAUTH_SECRET }}"
            - name: GOOGLE_CLIENT_ID
              value: "{{ .Values.GOOGLE_CLIENT_ID }}"
            - name: GOOGLE_CLIENT_SECRET
              value: "{{ .Values.GOOGLE_CLIENT_SECRET }}"
      imagePullSecrets:
        - name: connect2music-gitlab-registry-deploy-token
          
